name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-run the simulation
        run: npm run sim -- --days 60 --seed 1 | tail -40

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build dotnet/CrownAndCompass.sln -c Release
      - run: dotnet test dotnet/CrownAndCompass.sln -c Release --no-build
      # The Godot client compiles against Godot.NET.Sdk from NuGet; the engine itself is not needed.
      - run: dotnet build godot/CrownAndCompass.csproj -c ExportRelease
      - name: Smoke-run the C# simulation
        run: dotnet run --project dotnet/src/CrownAndCompass.Cli -c Release --no-build -- --days 120 --seed 1 | tail -40
